server:
  tomcat:
    threads:
      max: 1000
      min-spare: 50
    accept-count: 2000
    max-connections: 10000

spring:
  application:
    name: footballticket

  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
    url: jdbc:postgresql://localhost:5433/footballticket
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    database: postgresql
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
