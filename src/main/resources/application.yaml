server:
  tomcat:
    threads:
      max: 1000
      min-spare: 50
    accept-count: 2000
    max-connections: 10000

spring:
  application:
    name: footballticket

  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
    url: jdbc:postgresql://localhost:5433/footballticket
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    database: postgresql
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  data:
    redis:
      host: localhost
      port: 6389

  kafka:
    bootstrap-servers: localhost:9094
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.footballticket.messaging

jwt:
  secret: ${JWT_SECRET:c0VjdXJlLURldi1Pbmx5LVNlY3JldC1LZXktRm9yLUpXVC1IUzI1Ni1TaWduaW5nLTEyMzQ1Ng==}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:Admin@12345}

reservation:
  expiry:
    enabled: true
    fixed-delay-ms: 30000
    initial-delay-ms: 15000
    batch-size: 200
